apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "token-exchange-api.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
spec:
  data:
  - remoteRef:
      key: {{ .Release.Namespace }}/metatx/ethereum/rpc_url
    secretKey: BLOCKCHAIN_NODE_URL
  # RSA signing key for the permission tokens this service mints — distinct from
  # dauth's key. SIGNING_KEY_1 is the active signer; add SIGNING_KEY_2, ... during
  # a rotation overlap. (Provision the secret-store value separately.)
  - remoteRef:
      key: {{ .Release.Namespace }}/token-exchange-api/signing_key_1
    secretKey: SIGNING_KEY_1
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager-secret-store
  target:
    name: {{ include "token-exchange-api.fullname" . }}-secret
    template:
      metadata: {}

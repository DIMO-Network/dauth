apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dauth.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "dauth.labels" . | indent 4 }}
data:
{{- range $key, $val := .Values.env }}
  {{ $key }} : {{ $val | quote }}
{{- end }}
  # The Postgres challenge store's connection (DATABASE_URL) lives entirely in
  # the ExternalSecret (see secret.yaml); setting it lets dauth run multiple
  # replicas. Pool sizing is tuned inline via pgx query params, e.g.
  # ?pool_max_conns=10.

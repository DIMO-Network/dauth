apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dauth.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "dauth.labels" . | indent 4 }}
data:
{{- range $key, $val := .Values.env }}
  {{ $key }} : {{ $val | quote }}
{{- end }}
{{- if .Values.postgres.enabled }}
  # Postgres challenge store. Setting DB_HOST lets dauth run multiple replicas;
  # DB_USER/DB_PASSWORD come from the ExternalSecret (see secret.yaml).
  DB_HOST: {{ .Values.postgres.host | quote }}
  DB_PORT: {{ .Values.postgres.port | quote }}
  DB_NAME: {{ .Values.postgres.name | quote }}
  DB_SSL_MODE: {{ .Values.postgres.sslMode | quote }}
  DB_MAX_OPEN_CONNECTIONS: {{ .Values.postgres.maxOpenConnections | quote }}
  DB_MAX_IDLE_CONNECTIONS: {{ .Values.postgres.maxIdleConnections | quote }}
{{- end }}

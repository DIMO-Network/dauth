apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "dauth.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
spec:
  data:
  # RSA signing key(s), PEM-encoded. SIGNING_KEY_1 is the active signer; add
  # SIGNING_KEY_2, ... during a rotation overlap (see README).
  - remoteRef:
      key: {{ .Release.Namespace }}/dauth/signing_key_1
    secretKey: SIGNING_KEY_1
  # RPC endpoint for EIP-1271 (smart-account) signature checks.
  - remoteRef:
      key: {{ .Release.Namespace }}/dauth/rpc_url
    secretKey: RPC_URL
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager-secret-store
  target:
    name: {{ include "dauth.fullname" . }}-secret
    template:
      metadata: {}

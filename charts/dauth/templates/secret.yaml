apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "dauth.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
spec:
  data:
  # Sign-in (/siwe) RSA signing key(s), PEM-encoded. SIWE_SIGNING_KEY_1 is the
  # active signer; add SIWE_SIGNING_KEY_2, ... during a rotation overlap.
  - remoteRef:
      key: {{ .Release.Namespace }}/dauth/signing_key_1
    secretKey: SIWE_SIGNING_KEY_1
  # Exchange (/exchange) surface RSA signing key(s) — a DISTINCT key from the
  # sign-in surface (separate keyset is the security boundary between the two).
  - remoteRef:
      key: {{ .Release.Namespace }}/exchange/signing_key_1
    secretKey: EXCHANGE_SIGNING_KEY_1
  # RPC endpoint for sign-in EIP-1271 (smart-account) signature checks.
  - remoteRef:
      key: {{ .Release.Namespace }}/dauth/rpc_url
    secretKey: RPC_URL
  # RPC endpoint the exchange surface uses for on-chain reads.
  - remoteRef:
      key: {{ .Release.Namespace }}/metatx/ethereum/rpc_url
    secretKey: BLOCKCHAIN_NODE_URL
{{- if .Values.postgres.enabled }}
  # Postgres challenge store connection URL, e.g.
  # postgres://user:pass@host:5432/dauth?sslmode=require — the whole connection
  # (credentials included) is this one value. Provision it in AWS Secrets
  # Manager before enabling.
  - remoteRef:
      key: {{ .Release.Namespace }}/dauth/database_url
    secretKey: DATABASE_URL
{{- end }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager-secret-store
  target:
    name: {{ include "dauth.fullname" . }}-secret
    template:
      metadata: {}

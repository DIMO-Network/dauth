replicaCount: 1
image:
  repository: dimozone/dauth
  pullPolicy: IfNotPresent
  tag: 28b7518
imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: true
  annotations: {}
  name: ''
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
env:
  ENVIRONMENT: dev
  LOG_LEVEL: info
  HTTP_ADDRESS: 0.0.0.0:8080
  OPS_ADDRESS: 0.0.0.0:8081
  PUBLIC_BASE_URL: https://dauth.dev.dimo.zone
  DIRECTORY_URL: http://did-directory-dev:8080
  SIGNIN_ISSUER: https://dauth.dev.dimo.zone/signin
  JWT_AUDIENCE: dimo
  CHALLENGE_TTL: 5m
  TOKEN_TTL: 1h
  EXCHANGE_ISSUER: https://dauth.dev.dimo.zone/exchange
  EXCHANGE_AUDIENCE: dq
  ORG_HOST_URL: http://org-host-dev:8081
  DAUTH_DID: did:dimo:REPLACE_WITH_DAUTH_DID
  ENABLE_PPROF: 'false'
postgres:
  enabled: false
ports:
  - name: http
    containerPort: 8080
    protocol: TCP
  - name: ops
    containerPort: 8081
    protocol: TCP
livenessProbe:
  httpGet:
    path: /ping
    port: ops
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /ready
    port: ops
  initialDelaySeconds: 5
  periodSeconds: 10
resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
service:
  type: ClusterIP
  ports:
    http:
      port: 8080
      targetPort: http
      protocol: TCP
    ops:
      port: 8081
      targetPort: ops
      protocol: TCP
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'false'
  hosts:
    - host: dauth.dev.dimo.zone
      paths:
        - path: /
          pathType: Prefix
          port: 8080
  tls:
    - hosts:
        - dauth.dev.dimo.zone
      secretName: dauth-tls
serviceMonitor:
  enabled: true
  port: ops
  path: /metrics
  interval: 30s
podDisruptionBudget:
  enabled: false
  minAvailable: 1

replicaCount: 1
image:
  repository: dimozone/dauth
  pullPolicy: IfNotPresent
  tag: d0df91f
imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: true
  annotations: {}
  name: ''
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
env:
  ENVIRONMENT: dev
  LOG_LEVEL: info
  HTTP_ADDRESS: 0.0.0.0:8080
  OPS_ADDRESS: 0.0.0.0:8081
  PUBLIC_BASE_URL: https://dauth.dev.dimo.zone
  SIWE_ISSUER: https://dauth.dev.dimo.zone/siwe
  JWT_AUDIENCE: dimo
  SIWE_STATEMENT: Sign in to DIMO.
  CHAIN_ID: '80002'
  CHALLENGE_TTL: 5m
  TOKEN_TTL: 1h
  ALLOWABLE_TIME_SKEW: 5m
  RATE_LIMIT_RPS: '20'
  RATE_LIMIT_BURST: '40'
  EXCHANGE_ISSUER: https://dauth.dev.dimo.zone/exchange
  TOKEN_EXPIRATION: 10m
  GRPC_PORT: '8086'
  ENABLE_PPROF: 'false'
  USERS_API_GRPC_ADDRESS: users-api-dev:8086
  CONTRACT_ADDRESS_SACD: '0x4E5F9320b1c7cB3DE5ebDD760aD67375B66cF8a3'
  CONTRACT_ADDRESS_TEMPLATE: '0xbfc07085736426295f60baa15dc70743e98fe612'
  CONTRACT_ADDRESS_MANUFACTURER: '0xA4ad0F9c722588910791A9BAC63ADbB365614Bc7'
  CONTRACT_ADDRESS_VEHICLE: '0x45fbCD3ef7361d156e8b16F5538AE36DEdf61Da8'
  IDENTITY_URL: http://identity-api-dev:8080/query
  IPFS_BASE_URL: https://assets.dimo.xyz/ipfs
  IPFS_TIMEOUT: 30s
  DIMO_REGISTRY_CHAIN_ID: '80002'
# Postgres challenge store. When enabled, dauth reads DATABASE_URL from the
# ExternalSecret (provision <namespace>/dauth/database_url in AWS Secrets
# Manager) and can run multiple replicas; left disabled it uses the
# single-replica in-memory store.
postgres:
  enabled: false
ports:
  - name: http
    containerPort: 8080
    protocol: TCP
  - name: ops
    containerPort: 8081
    protocol: TCP
  - name: grpc
    containerPort: 8086
    protocol: TCP
livenessProbe:
  httpGet:
    path: /ping
    port: ops
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /ready
    port: ops
  initialDelaySeconds: 5
  periodSeconds: 10
resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
service:
  type: ClusterIP
  ports:
    http:
      port: 8080
      targetPort: http
      protocol: TCP
    ops:
      port: 8081
      targetPort: ops
      protocol: TCP
    grpc:
      port: 8086
      targetPort: grpc
      protocol: TCP
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'false'
  hosts:
    - host: dauth.dev.dimo.zone
      paths:
        - path: /
          pathType: Prefix
          port: 8080
  tls:
    - hosts:
        - dauth.dev.dimo.zone
      secretName: dauth-tls
serviceMonitor:
  enabled: true
  port: ops
  path: /metrics
  interval: 30s
podDisruptionBudget:
  enabled: false
  minAvailable: 1

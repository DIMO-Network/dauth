env:
  ENVIRONMENT: prod
  LOG_LEVEL: info
  HTTP_ADDRESS: "0.0.0.0:8080"
  OPS_ADDRESS: "0.0.0.0:8081"
  PUBLIC_BASE_URL: https://dauth.dimo.zone
  # --- sign-in surface (/signin) ---
  SIGNIN_ISSUER: https://dauth.dimo.zone/signin
  DIRECTORY_URL: http://did-directory-prod:8080
  JWT_AUDIENCE: dimo
  # Must equal accounts' ACCOUNTS_PUBLIC_URL exactly.
  SIGNIN_ALLOWED_AUDIENCES: https://accounts.dimo.org
  # Browser origins allowed to call /signin (login and console).
  SIGNIN_CORS_ORIGINS: https://login.dimo.org,https://console.dimo.org
  CHALLENGE_TTL: 5m
  # --- Exchange surface (/exchange) ---
  EXCHANGE_ISSUER: https://dauth.dimo.zone/exchange
  # Not set yet, and dauth does not start without them: ORG_HOST_URL and
  # DAUTH_DID (EXCHANGE_AUDIENCE defaults to dq).
  ENABLE_PPROF: "false"

# Postgres-backed challenge store. When enabled, raise replicaCount above 1 and
# provision the dauth/database_url secret (a postgres:// connection URL) in AWS
# Secrets Manager.
postgres:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 250m
    memory: 128Mi

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
  hosts:
    - host: dauth.dimo.zone
      paths:
        - path: /
          pathType: Prefix
          port: 8080
  tls:
    - hosts:
        - dauth.dimo.zone
      secretName: dauth-tls
